<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة شاكر الكردي - بوابتك نحو الثروة الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background: #0A0A0A;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(46, 139, 87, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .dollar-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .dollar {
            position: absolute;
            color: #FFD700;
            font-size: 30px;
            font-weight: 900;
            animation: fall linear infinite;
            opacity: 0.3;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .gold-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 0 10px #FFD700;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { transform: translateY(-20px) translateX(10px); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease-out;
        }

        .logo {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            margin-bottom: 15px;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
        }

        .tagline {
            font-size: 1.5rem;
            color: #2E8B57;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(46, 139, 87, 0.5);
        }

        .programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .program-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.9) 0%, rgba(10, 10, 10, 0.95) 100%);
            border: 2px solid #FFD700;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.2);
        }

        .program-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s;
        }

        .program-card:hover::before {
            left: 100%;
        }

        .program-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.4);
            border-color: #FFA500;
        }

        .program-image {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 20px;
            border: 3px solid #FFD700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            object-fit: cover;
            background: #1a1a1a;
        }

        .program-name {
            font-size: 1.8rem;
            font-weight: 900;
            color: #FFD700;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .download-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #0A0A0A;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.1rem;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.6);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }
            .tagline {
                font-size: 1.2rem;
            }
            .programs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dollar-rain" id="dollarRain"></div>
    <div class="gold-particles" id="goldParticles"></div>

    <div class="container">
        <div class="header">
            <h1 class="logo">منصة شاكر الكردي</h1>
            <p class="tagline">بوابتك نحو الثروة الرقمية</p>
        </div>

        <div class="programs-grid">
            
            <!-- الرابط الأول: الربح من المشي -->
            <div class="program-card">
                <img src="https://raw.githubusercontent.com/shakr95/shakr95/main/IMG_4458.jpeg" alt="الربح من المشي" class="program-image">
                <h3 class="program-name">الربح من المشي</h3>
                <a href="https://swcapp.com/i/shakralkurde" class="download-btn" target="_blank">تحميل البرنامج</a>
            </div>

            <!-- الرابط الثاني: قم بتحميل التطبيق لربح 100$ -->
            <div class="program-card">
                <img src="https://raw.githubusercontent.com/shakr95/shakr95/main/IMG_4460.jpeg" alt="قم بتحميل التطبيق لربح 100$" class="program-image">
                <h3 class="program-name">قم بتحميل التطبيق لربح 100$</h3>
                <a href="https://os8.me/jwfWaF" class="download-btn" target="_blank">تحميل البرنامج</a>
            </div>

            <!-- الرابط الثالث: 100$ لمجرد تحميل البرنامج -->
            <div class="program-card">
                <img src="https://raw.githubusercontent.com/shakr95/shakr95/main/IMG_4463.jpeg" alt="100$ لمجرد تحميل البرنامج" class="program-image">
                <h3 class="program-name">100$ لمجرد تحميل البرنامج</h3>
                <a href="https://os8.me/3MWHRz" class="download-btn" target="_blank">تحميل البرنامج</a>
            </div>

        </div>
    </div>

    <script>
        // إنشاء دولارات متساقطة
        const dollarRain = document.getElementById('dollarRain');
        const dollarCount = 20;
        
        for (let i = 0; i < dollarCount; i++) {
            const dollar = document.createElement('div');
            dollar.className = 'dollar';
            dollar.textContent = '$';
            dollar.style.left = Math.random() * 100 + '%';
            dollar.style.animationDuration = (Math.random() * 3 + 5) + 's';
            dollar.style.animationDelay = Math.random() * 5 + 's';
            dollar.style.fontSize = (Math.random() * 20 + 20) + 'px';
            dollarRain.appendChild(dollar);
        }

        // إنشاء جزيئات ذهبية
        const goldParticles = document.getElementById('goldParticles');
        const particleCount = 50;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 3 + 's';
            particle.style.animationDuration = (Math.random() * 2 + 2) + 's';
            goldParticles.appendChild(particle);
        }
    </script>
</body>
</html>
